
name: Build Nocturne Stonebound

on:
  push:
    paths:
      - 'Nocturne_Stonebound_Forge_Source (2).zip'
      - '.github/workflows/build-from-archive.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

     
      - name: Extract source archive
        run: |
          mkdir source
          unzip -q "Nocturne_Stonebound_Source_Improved.zip" -d source
          PROJECT_DIR="$(find source -type f -name build.gradle -print -quit | xargs dirname)"
          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "ERROR: Gradle project files not found"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build mod
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon build


      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: Nocturne-Stonebound-Forge-1.20.1
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
